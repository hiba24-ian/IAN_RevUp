<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cars - IAN RevUp</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<style>

@media(max-width: 768px){ header{height:60vh!important;} }
@media(max-width: 768px){ .parallax{background-attachment:scroll!important;} }
@media(max-width: 768px){
h1{font-size:2rem!important;} h2{font-size:1.7rem!important;}
p{font-size:1rem!important;} .mobile-padding{padding:1rem!important;}
}
@media(max-width: 768px){
nav{flex-wrap:wrap;gap:10px;font-size:.9rem;padding:10px;}
}

.parallax{
background-attachment:fixed;
background-size:cover;
background-position:center;
}

</style>
</head>

<body class="bg-gray-900 text-white font-sans">

<nav class="flex gap-6 justify-center py-4 bg-gray-900 fixed w-full z-50">
<a href="index.html" class="hover:text-red-500">Home</a>
<a href="cars.html" class="hover:text-red-500">Cars</a>
<a href="specialdeals.html" class="hover:text-red-500">Special Deals</a>
<a href="reviews.html" class="hover:text-red-500">Reviews</a>
</nav>

<header class="relative h-screen parallax" style="background-image:url('assets/images/car-header.jpg');">
<div class="absolute inset-0 bg-black bg-opacity-60 flex flex-col justify-center items-center text-center px-4">
<h1 class="text-6xl font-bold animate__animated animate__fadeInDown">Cars</h1>
<p class="text-2xl animate__animated animate__fadeInUp animate__delay-1s">Browse Our Collection</p>
</div>
</header>

<section class="py-20 px-4 md:px-20 bg-gray-800 mobile-padding">
<h2 class="text-4xl font-bold mb-12 text-center">Available Cars</h2>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

<div class="bg-gray-900 rounded-xl overflow-hidden hover:scale-105 transition">
<img src="assets/images/car1.jpg" class="w-full h-56 object-cover">
<div class="p-4"><h3 class="text-2xl font-bold">BMW M3</h3><p>$75,000</p></div>
</div>

<div class="bg-gray-900 rounded-xl overflow-hidden hover:scale-105 transition">
<img src="assets/images/car2.jpg" class="w-full h-56 object-cover">
<div class="p-4"><h3 class="text-2xl font-bold">Audi R8</h3><p>$120,000</p></div>
</div>

<div class="bg-gray-900 rounded-xl overflow-hidden hover:scale-105 transition">
<img src="assets/images/car3.jpg" class="w-full h-56 object-cover">
<div class="p-4"><h3 class="text-2xl font-bold">AMG GT</h3><p>$140,000</p></div>
</div>

</div>
</section>

</body>
</html>
